name: Get Usage Minutes

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 0 * * *' # Optional: Runs daily

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/actions-setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests # Add any other dependencies your script needs

    - name: Run Python Script
      # This injects the token into the runner's environment
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: python usageMinutes.py
