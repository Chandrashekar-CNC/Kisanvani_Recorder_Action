name: Get Usage Minutes
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
on:
  workflow_dispatch: # Allows manual triggering
  #schedule:
    #- cron: '0 0 * * *' # Optional: Runs daily

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.8
          
    
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests # Add any other dependencies your script needs
    
    - name: Send Github usage stats
      if: always()  # Optional: Ensures stats send even if previous steps skip or fail
      env:
        CNC_CH_ID: ${{ secrets.CNC_CH_ID }}
        CHATHUR_BOT: ${{ secrets.CHATHUR_BOT }}
        USAGE_MINUTES: ${{ secrets.USAGE_MINUTES }}
      run: |
        python usageMinutes.py
      continue-on-error: true
        
    
